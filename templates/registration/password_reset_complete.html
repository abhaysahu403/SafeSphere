{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Updated | SafeSphere</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body class="authpage">
    <div class="authpage-blob-1"></div>
    <div class="authpage-blob-2"></div>

    <div class="authpage-shell">
        <a href="{% url 'landing' %}" class="authpage-logo">
            <span class="authpage-logo-icon">🛡️</span>
            SafeSphere
        </a>

        <div class="authpage-card" style="grid-template-columns: 1fr; max-width: 440px;">
            <div class="authpage-formpanel" style="text-align: center;">
                <div class="authpage-message-icon">✅</div>
                <h2 class="authpage-title">Password updated</h2>
                <p class="authpage-subtitle">Your password has been changed successfully. You can now sign in with your new password.</p>
                <a href="{% url 'login' %}" class="authpage-submit" style="text-decoration:none; display:flex;">Sign In</a>
            </div>
        </div>
    </div>
</body>
</html>
