{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Your Email | SafeSphere</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body class="authpage">
    <div class="authpage-blob-1"></div>
    <div class="authpage-blob-2"></div>

    <div class="authpage-shell">
        <a href="{% url 'landing' %}" class="authpage-logo">
            <span class="authpage-logo-icon">🛡️</span>
            SafeSphere
        </a>

        <div class="authpage-card" style="grid-template-columns: 1fr; max-width: 440px;">
            <div class="authpage-formpanel" style="text-align: center;">
                <div class="authpage-message-icon">📬</div>
                <h2 class="authpage-title">Check your email</h2>
                <p class="authpage-subtitle">
                    If an account exists with that email, we've sent a link to reset your password.
                    It may take a few minutes to arrive — check your spam folder too.
                </p>
                <a href="{% url 'login' %}" class="authpage-back" style="margin: 0 auto;">← Back to Sign In</a>
            </div>
        </div>
    </div>
</body>
</html>
